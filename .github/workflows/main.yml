      # LaunchScreen
      # ───────────────────────────────────────────────────────────────────────────
      - name: LaunchScreen.storyboard
        run: |
          cat > DT3D/Resources/LaunchScreen.storyboard << 'SB_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0"
                    toolsVersion="21701" targetRuntime="AppleCocoa Touch"
                    propertyAccessControl="none" useAutolayout="YES"
                    launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES">
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21678"/>
              </dependencies>
              <scenes>
                  <scene sceneID="sc1">
                      <objects>
                          <viewController id="vc1" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="vw1">
                                  <rect key="frame" x="0.0" y="0.0" width="430" height="932"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.03" green="0.02" blue="0.05"
                                         alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                  <label opaque="NO" userInteractionEnabled="NO" contentMode="left"
                                         text="DEAD TOWN 3D" textAlignment="center"
                                         lineBreakMode="middleTruncation" baselineAdjustment="alignBaselines"
                                         adjustsFontSizeToFit="NO"
                                         translatesAutoresizingMaskIntoConstraints="NO" id="lb1">
                                      <rect key="frame" x="0.0" y="400" width="430" height="60"/>
                                      <fontDescription key="fontDescription" type="boldSystem" pointSize="44"/>
                                      <color key="textColor" red="0.92" green="0.05" blue="0.05" alpha="1"
                                             colorSpace="custom" customColorSpace="sRGB"/>
                                      <nil key="highlightedColor"/>
                                  </label>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="fb1"
                                       sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          SB_EOF

      # ───────────────────────────────────────────────────────────────────────────
      # AppIcon
      # ───────────────────────────────────────────────────────────────────────────
      - name: AppIcon
        run: |
          cat > DT3D/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {"images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"icon.png","scale":"1x"}],"info":{"author":"xcode","version":1}}
          JSON_EOF
          cat > DT3D/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PY_EOF'
          import struct,zlib,math
          def png(w,h):
              def u32(n):return struct.pack('>I',n)
              def chunk(t,d):return u32(len(d))+t+d+u32(zlib.crc32(t+d)&0xffffffff)
              rows=[]
              for y in range(h):
                  row=[0]
                  for x in range(w):
                      cx,cy=x-w//2,y-h//2
                      dist=math.sqrt(cx*cx+cy*cy)
                      # Dark night bg
                      br=max(0,int(12-dist*0.010)); bg=max(0,int(8-dist*0.007)); bb=max(0,int(20-dist*0.016))
                      # Moon
                      md=math.sqrt((cx-w*0.28)**2+(cy+h*0.26)**2)
                      if md<w*0.14:
                          f=1-md/(w*0.14); r=int(210*f+br*(1-f)); g=int(200*f+bg*(1-f)); b=int(170*f+bb*(1-f))
                      # Town silhouette
                      elif cy>-h*0.05 and cy<h*0.28:
                          bld=abs(cx)%80<35 and cy<h*0.28-abs(cx)%80*0.3
                          if bld: r,g,b=8,6,4
                          else: r,g,b=int(22*(1-cy/h*2)),int(42*(1-cy/h*2)),int(16*(1-cy/h*2))
                      # Blood text area
                      elif abs(cx)<120 and -30<cy<30:
                          r,g,b=140,8,8
                      else:
                          r,g,b=br,bg,bb
                      row+=[min(255,r),min(255,g),min(255,b)]
                  rows.append(bytes(row))
              raw=zlib.compress(b''.join(rows),9)
              sig=b'\x89PNG\r\n\x1a\n'
              ihdr=u32(w)+u32(h)+bytes([8,2,0,0,0])
              return sig+chunk(b'IHDR',ihdr)+chunk(b'IDAT',raw)+chunk(b'IEND',b'')
          with open('DT3D/Resources/Assets.xcassets/AppIcon.appiconset/icon.png','wb') as f:
              f.write(png(1024,1024))
          print('Icon OK')
          PY_EOF

      # ───────────────────────────────────────────────────────────────────────────
      # XcodeGen + Build + Package + Upload
      # ───────────────────────────────────────────────────────────────────────────
      - name: XcodeGen
        working-directory: DT3D
        run: xcodegen generate --spec project.yml --project .

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project DT3D/DeadTown3D.xcodeproj \
            -scheme DeadTown3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== ERRORS ===" && grep "error:" build.log | head -30 && exit 1)

      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "DeadTown3D.app" -type d | head -1)
          [ -z "$APP" ] && (grep "error:" build.log | head -20; exit 1)
          echo "Found: $APP"
          mkdir -p Payload; cp -r "$APP" Payload/DeadTown3D.app
          rm -rf Payload/DeadTown3D.app/_CodeSignature 2>/dev/null || true
          zip -r DeadTown3D.ipa Payload
          echo "IPA: $(du -sh DeadTown3D.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeadTown3D-iPhone15ProMax
          path: DeadTown3D.ipa
          retention-days: 30

